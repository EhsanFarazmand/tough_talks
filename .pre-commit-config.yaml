# Pre-commit hook config. Activate locally with:
#   pip install pre-commit
#   pre-commit install
#
# Runs the same ruff lint that CI runs, but locally on every commit so
# bad code never even reaches the remote. The schema/notebook checks
# stay in CI only — they're cheap there and don't need to block commits.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore=E501]
        files: ^(backend|scripts)/.*\.py$
