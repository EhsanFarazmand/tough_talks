name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

    - name: Install dependencies (no torch/GPU for CI)
      run: |
        pip install fastapi uvicorn pydantic pytest pytest-asyncio httpx ruff black

    - name: Lint
      run: |
        ruff check backend/ tests/ --ignore E501
        black --check backend/ tests/

    - name: Run unit tests
      run: |
        pytest tests/unit/ -v --tb=short

    - name: Validate JSON schemas
      run: |
        python scripts/validate_schemas.py

  notebook-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check notebooks are valid JSON
      run: |
        python -c "
        import json, pathlib, sys
        nbs = list(pathlib.Path('notebooks').rglob('*.ipynb'))
        errors = []
        for nb in nbs:
            try:
                json.loads(nb.read_text())
            except json.JSONDecodeError as e:
                errors.append(f'{nb}: {e}')
        if errors:
            print('Invalid notebooks:')
            for e in errors: print(' -', e)
            sys.exit(1)
        print(f'All {len(nbs)} notebooks valid.')
        "
